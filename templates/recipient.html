<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A mix for {{ playlist.recipient_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.8/dist/cdn.min.js"></script>
</head>
<body class="bg-red-50 min-h-screen text-gray-800 p-4 max-w-md mx-auto" x-data="{ revealed: false }">
    <div x-show="!revealed" class="flex flex-col items-center justify-center h-[80vh]">
        <h1 class="text-3xl font-bold mb-8">For {{ playlist.recipient_name }}</h1>
        <button @click="revealed = true" class="bg-red-600 text-white font-bold py-3 px-8 rounded-full shadow-lg animate-bounce">
            Open Gift
        </button>
    </div>
    <div x-show="revealed" style="display: none;" class="pb-10 pt-4">
        <div class="bg-white p-6 rounded-lg shadow mb-8 text-center border-t-4 border-red-500">
            <h2 class="text-2xl font-bold mb-4">From: {{ playlist.sender_name }}</h2>
            <p class="text-gray-700 italic">"{{ playlist.message }}"</p>
        </div>
        <div class="space-y-6">
            {% for song in songs %}
            <div class="bg-white rounded-lg shadow overflow-hidden border border-gray-100">
                <div class="aspect-video">
                    <iframe width="100%" height="100%" 
                            src="https://www.youtube.com/embed/{{ song.youtube_id }}" 
                            title="YouTube video player" frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                    </iframe>
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-lg">{{ song.title }}</h3>
                    {% if song.note %}
                    <p class="mt-2 text-sm text-gray-600 bg-gray-50 p-3 border-l-2 border-red-400 rounded-r">
                        {{ song.note }}
                    </p>
                    {% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
